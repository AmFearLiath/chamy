name: Sync Wiki

on:
  push:
    branches:
      - main

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name "chamy-wiki-bot"
          git config --global user.email "noreply@chamy.local"

      - name: Generate wiki pages
        run: |
          mkdir -p .wiki-tmp
          printf '%s\n' \
            '# Chamy Wiki' \
            '' \
            'Welcome to the Chamy project wiki.' \
            '' \
            'See sidebar for navigation.' > .wiki-tmp/Home.md
          printf '%s\n' \
            '- [Home](Home)' \
            '- [Getting Started](Getting-Started)' \
            '- [Architecture](Architecture)' \
            '- [Admin Guide](Admin-Guide)' \
            '- [Developer Guide](Developer-Guide)' \
            '- [Module Reference](Module-Reference)' \
            '- [API Reference](API-Reference)' \
            '- [Tutorials](Tutorials)' \
            '- [Deployment](Deployment)' \
            '- [Security and Ops](Security-and-Ops)' \
            '- [Troubleshooting](Troubleshooting)' \
            '- [FAQ](FAQ)' > .wiki-tmp/_Sidebar.md
          # add more pages as needed
          echo "Pages generated in .wiki-tmp"

      - name: Clone wiki repo
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "WIKI_PUSH_TOKEN secret not set - skipping wiki publish"
            echo "SKIP_WIKI_PUSH=1" >> "$GITHUB_ENV"
            exit 0
          fi
          WIKI_URL="https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          git clone "$WIKI_URL" wiki

      - name: Copy pages and push
        run: |
          if [ "${SKIP_WIKI_PUSH}" = "1" ]; then
            echo "Wiki publish skipped because WIKI_PUSH_TOKEN is not configured"
            exit 0
          fi
          cp -r .wiki-tmp/* wiki/
          cd wiki
          echo "Current wiki branch: $(git branch --show-current)"
          git add --all
          if git commit -m "Publish wiki: $GITHUB_SHA"; then
            # Push current checked out branch (wiki repos are often on master, not main)
            git push origin HEAD
          else
            echo "No wiki changes to commit"
          fi
